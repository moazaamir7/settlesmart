services:
  - type: web
    name: settlesmart-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:5173
      - key: ALLOWED_HOSTS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
